<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="รับ-จ่าย">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2b3035" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>บัญชีรับ-จ่าย</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* หน้าครอบ: ฝังเว็บแอป Apps Script เต็มจอ (ไม่มีแถบเตือนของ Google) */
  :root { --top: #f8f9fa; --bottom: #ffffff; --ink: #6c757d; }
  @media (prefers-color-scheme: dark) { :root { --top: #2b3035; --bottom: #212529; --ink: #adb5bd; } }
  html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(var(--top) 50%, var(--bottom) 50%); }
  iframe {
    position: fixed; border: 0; left: env(safe-area-inset-left, 0); right: env(safe-area-inset-right, 0);
    top: env(safe-area-inset-top, 0); bottom: env(safe-area-inset-bottom, 0);
    width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
    height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    opacity: 0; transition: opacity .4s ease;
  }
  iframe.ready { opacity: 1; }
  .splash { position: fixed; inset: 0; display: grid; place-items: center; background: var(--top);
    font: 500 15px/1.4 system-ui, -apple-system, sans-serif; color: var(--ink); transition: opacity .4s ease; }
  .splash.gone { opacity: 0; pointer-events: none; }
  .splash img { width: 88px; height: 88px; border-radius: 22px; display: block; margin: 0 auto 14px;
    box-shadow: 0 10px 28px rgba(13,110,253,.35); animation: breathe 1.8s ease-in-out infinite; }
  .bar { width: 120px; height: 4px; border-radius: 2px; margin: 14px auto 0; overflow: hidden; background: rgba(13,110,253,.18); }
  .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 2px; background: #0d6efd; animation: slide 1.1s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .splash img, .bar::after { animation: none; } }
</style>
</head>
<body>
  <div class="splash" id="splash">
    <div style="text-align:center">
      <img src="apple-touch-icon.png" alt="">
      บัญชีรับ-จ่าย
      <div class="bar"></div>
    </div>
  </div>
  <iframe id="app" title="บัญชีรับ-จ่าย" allow="clipboard-write" src="https://script.google.com/macros/s/AKfycbwSh4nMQaqiCoipORORlfLCbdC-ue9PkgOJUueuYqG9wm8WkK47fkQ5gGda1cky6Ml69A/exec"></iframe>
  <script>
    var f = document.getElementById('app'), s = document.getElementById('splash');
    function show() { f.classList.add('ready'); s.classList.add('gone'); }
    // Apps Script โหลดหลายชั้น: รอเฟรมโหลด + เผื่อเวลาให้หน้าแอปวาดเสร็จ
    f.addEventListener('load', function () { setTimeout(show, 700); });
    setTimeout(show, 9000);
  </script>
</body>
</html>
